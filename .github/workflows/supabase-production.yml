name: Deploy Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'Botera-Final-Live-Orders/supabase/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Botera-Final-Live-Orders
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: bbixzcaxlvotdhhqfatw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Check deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Reconcile remote-only migration history
        run: |
          # These versions exist in the production migration history but are
          # intentionally no longer represented by local migration files.
          # Supabase CLI reports them as the exact blocking versions for db push.
          supabase migration repair --status reverted 20260817023812 20260817024128

      - name: Deploy database migrations
        run: supabase db push --include-all --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
