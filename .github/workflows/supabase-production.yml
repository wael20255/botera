name: Deploy Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'Botera-Final-Live-Orders/supabase/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Botera-Final-Live-Orders
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: bbixzcaxlvotdhhqfatw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Verify target Supabase project
        run: |
          echo "Deploy target: $SUPABASE_PROJECT_ID"
          supabase projects list --output json >/dev/null

      - name: Deploy database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
