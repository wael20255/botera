name: Deploy Botera to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'Botera-Final-Live-Orders/**'
      - 'wrangler.jsonc'
      - 'worker.js'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_URL: https://botera.botera.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Botera Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy version to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy

      - name: Promote latest uploaded version to production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSIONS_JSON="$(npx wrangler versions list --name botera --json)"
          VERSION_ID="$(printf '%s' "$VERSIONS_JSON" | node -e '
            const fs=require("fs");
            const raw=fs.readFileSync(0,"utf8");
            const data=JSON.parse(raw);
            const items=Array.isArray(data) ? data : (data.result?.items || data.items || []);
            if(!items.length) process.exit(2);
            items.sort((a,b)=>new Date(b.metadata?.created_on || b.created_on || 0)-new Date(a.metadata?.created_on || a.created_on || 0));
            process.stdout.write(items[0].id || "");
          ')"
          test -n "$VERSION_ID"
          echo "Promoting uploaded version: ${VERSION_ID}"
          npx wrangler versions deploy "${VERSION_ID}" -y
          npx wrangler deployments list --name botera --json

      - name: Verify production serves the deployed Orders assets
        shell: bash
        run: |
          set -euo pipefail
          html_marker='BOTERA_PRODUCTION_BUILD=orders-live-20260817'
          editor_marker='BOTERA_ORDER_EDITOR_BUILD=orders-editor-live-20260817'
          for attempt in {1..12}; do
            echo "Production verification attempt ${attempt}/12"
            html="$(curl -fsSL --retry 2 --retry-delay 1 "${PRODUCTION_URL}/orders.html?verify=${GITHUB_SHA}" || true)"
            editor="$(curl -fsSL --retry 2 --retry-delay 1 "${PRODUCTION_URL}/assets/js/orders-editor.js?verify=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -Fq "$html_marker" && printf '%s' "$editor" | grep -Fq "$editor_marker"; then
              echo "Production is serving the current Orders page and editor assets."
              exit 0
            fi
            sleep 5
          done
          echo "Production did not serve the current Orders assets."
          exit 1
