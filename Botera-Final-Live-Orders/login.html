<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Botera Co.</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <div class="login-logo">
        <span class="sidebar-logo-icon" style="width:34px;height:34px;"><svg viewBox="0 0 24 24" fill="none" stroke="#06240f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="3"/><circle cx="8.5" cy="14.5" r="1.4" fill="#06240f" stroke="none"/><circle cx="15.5" cy="14.5" r="1.4" fill="#06240f" stroke="none"/><path d="M12 9V5"/><circle cx="12" cy="3.5" r="1.5" fill="#06240f" stroke="none"/></svg></span>
        botera
      </div>
      <form id="loginForm">
        <div class="form-field">
          <label class="form-label" for="email">الإيميل</label>
          <input class="form-input" id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">كلمة السر</label>
          <input class="form-input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="loginError" style="display:none;"></div>
        <button class="btn" type="submit" style="width:100%;">تسجيل الدخول</button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">نسيت كلمة السر؟</a>
        <span class="muted-link">لسه معندكش شركة على المنصة؟ <a href="register.html">سجّل شركتك</a></span>
      </div>
    </div>
  </div>
  <script src="assets/lib/supabase-client.js"></script><script src="assets/lib/realtime.js"></script>
  <script src="assets/lib/store.js"></script>
  <script src="assets/services/auth-service.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
